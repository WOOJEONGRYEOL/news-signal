# 클라우드 수집 — 맥이 꺼져 있어도 30분 간격으로 돈다.
# 데이터베이스(급상승 기준선·이슈 연속성)는 Actions 캐시로 회차 사이에 이어지고,
# 결과(site/data)는 main 에 커밋되어 Pages 로 배포된다.
name: Collect

on:
  schedule:
    # 예비용. GitHub 예약은 부하에 따라 늦거나 거른다(실제로 하루 5~7번만 돈다).
    # 평소 30분 간격은 아래 relay(이어달리기)가 만든다. 예약은 그 사슬이 끊겼을 때 다시 잇는 역할.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "doctor = 출처 연결만 점검 · collect = 실제 수집"
        default: collect
        type: choice
        options: [collect, doctor]
      force:
        description: "최근 수집이 있어도 그냥 수집"
        default: false
        type: boolean

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 출처 연결 점검
        if: ${{ inputs.mode == 'doctor' }}
        run: |
          echo "러너 위치:"; curl -s --max-time 10 https://ipinfo.io/json || true
          echo; echo "출처 점검:"; python -m newssignal doctor

      - name: 최근 수집 확인
        id: fresh
        if: ${{ inputs.mode != 'doctor' }}
        run: |
          AGE=$(python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          try:
              t = json.load(open("site/data/manifest.json"))["latest"]
              print(int((datetime.now(timezone(timedelta(hours=9))) - datetime.fromisoformat(t)).total_seconds() // 60))
          except Exception:
              print(9999)
          PY
          )
          echo "마지막 수집: ${AGE}분 전"
          if [ "${{ inputs.force }}" = "true" ] || [ "$AGE" -gt 25 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "아직 최신이라 건너뜁니다"
          fi

      - name: 데이터베이스 복원 (캐시)
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: data/newssignal.sqlite3
          key: ns-db-${{ github.run_id }}
          restore-keys: ns-db-

      - name: 캐시가 비었으면 씨앗 데이터베이스 사용
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        run: |
          if [ ! -f data/newssignal.sqlite3 ] && [ -f data/seed.sqlite3.gz ]; then
            echo "캐시 없음 → 씨앗 복원"
            gunzip -c data/seed.sqlite3.gz > data/newssignal.sqlite3
          fi
          ls -la data/ || true

      - name: 수집
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        run: python -m newssignal collect

      - name: 데이터베이스 줄이기 (최근 회차만)
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        run: python -m newssignal compact --keep 3

      - name: 데이터베이스 저장 (캐시)
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: data/newssignal.sqlite3
          key: ns-db-${{ github.run_id }}

      - name: 결과 커밋·푸시
        id: commit
        if: ${{ inputs.mode != 'doctor' && steps.fresh.outputs.run == 'true' }}
        run: |
          git config user.name "News Signal Bot"
          git config user.email "noreply@github.com"
          git add -A -- site/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%F %H:%M') 수집 (Actions)"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q; then
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "푸시 실패"; exit 1

  # 이어달리기: 이 회차가 끝나고 25분 뒤에 다음 회차를 깨운다.
  # GitHub 예약은 몇 시간씩 거르지만, workflow_dispatch 는 Actions 토큰으로도 새 회차를 만들 수 있다.
  # 사슬이 끊기면(취소·실패) 위의 예약이 다시 이어 준다.
  #
  # 회의 시각 맞춤: 10시·14시·16시(KST) 회의 전에 새 결과가 올라가 있도록, 다음 회차가 9:47·13:47·15:47 에
  # 시작되게 대기 시간을 늘이거나 줄인다. 깨운 뒤 배포까지 약 4분이라 9:51·13:51·15:51 쯤 화면에 반영된다.
  # 맞춤 시각까지 35분 이내면 그 시각으로 바로 맞춰(간격 25~35분) 직전 회차와 몇 분 차로 몰려 찍히지 않게 한다.
  relay:
    needs: run
    if: ${{ always() && inputs.mode != 'doctor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
    steps:
      - name: 다음 회차 시각 정하기
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          KST = timezone(timedelta(hours=9))
          GAP, SLACK, LEAD = 25 * 60, 10 * 60, 13          # 기본 간격 · 맞춤 허용 폭 · 회의 몇 분 전에 시작할지
          now = datetime.now(KST)
          slots = [(now + timedelta(days=d)).replace(hour=h, minute=0, second=0, microsecond=0) - timedelta(minutes=LEAD)
                   for d in (0, 1) for h in (10, 14, 16)]
          nxt = min((t for t in slots if (t - now).total_seconds() >= 60), default=None)
          wait = (nxt - now).total_seconds() if nxt else None
          if wait is not None and wait <= GAP + SLACK:
              print(f"sleep={int(wait)}"); print("force=true"); print(f"why=회의 전 맞춤 {nxt:%H:%M}")
          else:
              print(f"sleep={GAP}"); print("force=false"); print("why=기본 25분")
          PY
      - name: 다음 회차까지 대기 (${{ steps.plan.outputs.why }})
        run: sleep ${{ steps.plan.outputs.sleep }}
      - name: 다음 회차 깨우기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=collect -f force=${{ steps.plan.outputs.force }}

  # Actions 토큰으로 만든 커밋은 다른 워크플로(pages.yml)를 깨우지 않는다. 그래서 여기서 직접 배포한다.
  deploy:
    needs: run
    if: ${{ needs.run.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
