# 클라우드 수집 — 맥이 꺼져 있어도 매시 0분·30분에 돈다.
# 데이터베이스(급상승 기준선·이슈 연속성)는 Actions 캐시로 회차 사이에 이어지고,
# 결과(site/data)는 main 에 커밋되어 Pages 로 배포된다.
name: Collect

on:
  schedule:
    - cron: "0,30 * * * *"      # UTC 기준이지만 KST 도 정각·30분 (UTC+9)
  workflow_dispatch:
    inputs:
      mode:
        description: "doctor = 출처 연결만 점검 · collect = 실제 수집"
        default: collect
        type: choice
        options: [collect, doctor]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 출처 연결 점검
        if: ${{ inputs.mode == 'doctor' }}
        run: |
          echo "러너 위치:"; curl -s --max-time 10 https://ipinfo.io/json || true
          echo; echo "출처 점검:"; python -m newssignal doctor

      - name: 데이터베이스 복원 (캐시)
        if: ${{ inputs.mode != 'doctor' }}
        uses: actions/cache/restore@v4
        with:
          path: data/newssignal.sqlite3
          key: ns-db-${{ github.run_id }}
          restore-keys: ns-db-

      - name: 캐시가 비었으면 씨앗 데이터베이스 사용
        if: ${{ inputs.mode != 'doctor' }}
        run: |
          if [ ! -f data/newssignal.sqlite3 ] && [ -f data/seed.sqlite3.gz ]; then
            echo "캐시 없음 → 씨앗 복원"
            gunzip -c data/seed.sqlite3.gz > data/newssignal.sqlite3
          fi
          ls -la data/ || true

      - name: 수집
        if: ${{ inputs.mode != 'doctor' }}
        run: python -m newssignal collect

      - name: 데이터베이스 저장 (캐시)
        if: ${{ inputs.mode != 'doctor' }}
        uses: actions/cache/save@v4
        with:
          path: data/newssignal.sqlite3
          key: ns-db-${{ github.run_id }}

      - name: 결과 커밋·푸시
        if: ${{ inputs.mode != 'doctor' }}
        run: |
          git config user.name "News Signal Bot"
          git config user.email "noreply@github.com"
          git add -A -- site/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%F %H:%M') 수집 (Actions)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep 5
          done
          echo "푸시 실패"; exit 1
